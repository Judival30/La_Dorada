name: ladorada

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ladorada
      POSTGRES_PASSWORD: ladorada
      POSTGRES_DB: ladorada
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db-init.sql:/docker-entrypoint-initdb.d/db-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ladorada -d ladorada']
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO no longer publishes pullable images (Docker Hub / quay.io), so the
  # S3-compatible server is RustFS (presigned URLs, private buckets).
  s3:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ladorada
      RUSTFS_SECRET_KEY: ladorada-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - s3-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/health']
      interval: 5s
      timeout: 5s
      retries: 12

  s3-init:
    image: amazon/aws-cli:2.17.0
    depends_on:
      s3:
        condition: service_healthy
    restart: 'no'
    environment:
      AWS_ACCESS_KEY_ID: ladorada
      AWS_SECRET_ACCESS_KEY: ladorada-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ['/bin/sh', '-c']
    command:
      - >
        aws --endpoint-url http://s3:9000 s3api head-bucket --bucket ladorada-private
        || aws --endpoint-url http://s3:9000 s3api create-bucket --bucket ladorada-private;
        aws --endpoint-url http://s3:9000 s3api put-public-access-block
        --bucket ladorada-private
        --public-access-block-configuration
        BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true;
        aws --endpoint-url http://s3:9000 s3api head-bucket --bucket ladorada-private

  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - '1025:1025'
      - '8025:8025'

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://ladorada:ladorada@db:5432/ladorada
      S3_ENDPOINT: http://s3:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ladorada
      S3_SECRET_KEY: ladorada-secret
      S3_BUCKET: ladorada-private
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      APP_URL: http://localhost:3000
      SESSION_TTL_DAYS: '7'
      ADAPTERS_MODE: mock
    ports:
      - '3000:3000'
    # TODO(Task 7): run `prisma migrate deploy` before starting the server, e.g.
    #   command: sh -c "npx prisma migrate deploy && node server.js"
    command: ['node', 'server.js']

volumes:
  db-data:
  s3-data:
