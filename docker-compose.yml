name: ladorada

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ladorada
      POSTGRES_PASSWORD: ladorada
      POSTGRES_DB: ladorada
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db-init.sql:/docker-entrypoint-initdb.d/db-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ladorada -d ladorada']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ladorada
      MINIO_ROOT_PASSWORD: ladorada-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ladorada ladorada-secret &&
      mc mb --ignore-existing local/ladorada-private &&
      mc anonymous set none local/ladorada-private
      "

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://ladorada:ladorada@db:5432/ladorada
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ladorada
      S3_SECRET_KEY: ladorada-secret
      S3_BUCKET: ladorada-private
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      APP_URL: http://localhost:3000
      SESSION_TTL_DAYS: '7'
      ADAPTERS_MODE: mock
    ports:
      - '3000:3000'
    # TODO(Task 7): run `prisma migrate deploy` before starting the server, e.g.
    #   command: sh -c "npx prisma migrate deploy && node server.js"
    command: ['node', 'server.js']

volumes:
  db-data:
  minio-data:
